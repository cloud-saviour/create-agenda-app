<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agora Agenda Creator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── APP SHELL ───────────────────────────────────────── */
:root { --red: #CE3C17; --dark: #3b1f10; }

body { font-family: Arial, sans-serif; background: #e8eaed; font-size: 13px; }

.app-bar {
  background: var(--dark); color: #fff; height: 48px;
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  box-shadow: 0 1px 4px rgba(0,0,0,.4);
}
.app-bar img { height: 30px; }
.app-bar h1 { font-size: .95rem; font-weight: 700; }
.app-bar .sp { flex: 1; }
.btn {
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3);
  color: #fff; padding: 5px 11px; border-radius: 4px;
  font-size: .75rem; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,.25); }
.btn.red { background: var(--red); border-color: var(--red); }
.btn.red:hover { background: #b33210; }

.layout {
  display: grid; grid-template-columns: 390px 1fr;
  height: calc(100vh - 48px); margin-top: 48px;
}

/* ── FORM ────────────────────────────────────────────── */
.fp { background: #fff; border-right: 1px solid #d0d7de; overflow-y: auto; }
.fb { padding: 14px 13px; }

.sec { margin-bottom: 18px; }
.sec-t {
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .7px; color: var(--dark);
  border-bottom: 2px solid var(--red); padding-bottom: 4px; margin-bottom: 10px;
}
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
.g4 { display: grid; grid-template-columns: 2fr 2fr 1.2fr; gap: 7px; }

.f { margin-bottom: 7px; }
.f label { display: block; font-size: .69rem; font-weight: 600; color: #57606a; margin-bottom: 2px; }
.f input, .f select, .f textarea {
  width: 100%; padding: 4px 7px; border: 1px solid #d0d7de;
  border-radius: 3px; font-size: .78rem; font-family: inherit; background: #fafbfc;
}
.f input:focus, .f select:focus, .f textarea:focus {
  outline: none; border-color: var(--red);
  box-shadow: 0 0 0 2px rgba(206,60,23,.1); background: #fff;
}
.f textarea { resize: vertical; min-height: 42px; }

.card {
  background: #f8f9fa; border: 1px solid #d0d7de;
  border-radius: 4px; padding: 9px 10px; margin-bottom: 7px;
}
.ch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.cl { font-size: .73rem; font-weight: 700; color: var(--dark); }
.brm {
  background: #ffdce0; color: #b91c1c;
  border: 1px solid #fbb; border-radius: 3px;
  padding: 2px 7px; font-size: .68rem; font-weight: 600; cursor: pointer;
}
.badd {
  background: var(--red); color: #fff; border: none; border-radius: 3px;
  padding: 5px 11px; font-size: .75rem; font-weight: 600; cursor: pointer; margin-top: 2px;
}
.badd:hover { background: #b33210; }

/* ── AGENDA FORM CARDS ───────────────────────────────── */
.ag-card { padding: 5px 8px; margin-bottom: 4px; }
.ag-card.type-dual { background: #f0f4ff; border-color: #c5d5f5; }
.ag-card.type-special { background: #f5f0ff; border-color: #d5c5f5; }
.ag-card.type-notes { background: #fff8f0; border-color: #f5d5c5; }
.ag-card.type-recess { background: #f0fff4; border-color: #c5f5d5; }

.ag-row { display: flex; align-items: center; gap: 3px; }
.ag-title { flex: 3; min-width: 0; font-size: .72rem !important; padding: 3px 5px !important; }
.ag-role  { flex: 1.5; min-width: 0; font-size: .72rem !important; padding: 3px 5px !important; }
.ag-person { flex: 2; min-width: 0; font-size: .72rem !important; padding: 3px 5px !important; }
.ag-dur { width: 38px !important; text-align: center; font-size: .72rem !important; padding: 3px 4px !important; flex-shrink: 0; }
.ag-ta { width: 100%; font-size: .72rem !important; padding: 3px 5px !important; min-height: 32px; resize: vertical; }
.ag-row input, .ag-row select { border: 1px solid #d0d7de; border-radius: 3px; background: #fff; font-family: inherit; }
.ag-row input:focus, .ag-row select:focus { outline: none; border-color: var(--red); }

.ag-special-lbl { font-size: .71rem; font-weight: 700; color: #666; font-style: italic; flex: 1; }
.ag-type-badge {
  font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 1px 5px; border-radius: 3px; color: #fff; margin-right: 4px; flex-shrink: 0;
}
.badge-row     { background: #6c757d; }
.badge-dual    { background: #3b82f6; }
.badge-special { background: #8b5cf6; }
.badge-recess  { background: #10b981; }
.badge-notes   { background: #f59e0b; }

.drag-handle {
  cursor: grab; color: #bbb; font-size: .9rem; flex-shrink: 0;
  padding: 0 3px; user-select: none; line-height: 1;
}
.drag-handle:active { cursor: grabbing; }
.ag-card.dragging  { opacity: .35; outline: 2px dashed #aaa; }
.ag-card.drag-over { outline: 2px solid var(--red); background-color: #fff5f2 !important; }

/* Edit-mode toggle */
.ag-edit-btn {
  font-size: .68rem; padding: 2px 8px; border-radius: 3px; cursor: pointer;
  border: 1px solid #ccc; background: #f4f4f4; color: #555; font-weight: 600;
  transition: background .15s, color .15s;
}
.ag-edit-btn.active { background: var(--red); color: #fff; border-color: var(--red); }

/* Hide controls when not in edit mode */
.ag-section:not(.ag-edit-active) .drag-handle { display: none !important; }
.ag-section:not(.ag-edit-active) .ag-card .brm { display: none !important; }
.ag-section:not(.ag-edit-active) .ag-add-bar   { display: none !important; }
.ag-section:not(.ag-edit-active) .ag-card[draggable] { cursor: default; }

.ag-add-bar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.badd-type {
  font-size: .68rem; font-weight: 600; cursor: pointer; padding: 3px 8px;
  border-radius: 3px; border: 1px solid; flex-shrink: 0;
}
.badd-type.t-row     { background: #f0f2f5; border-color: #aaa; color: #333; }
.badd-type.t-dual    { background: #e8eeff; border-color: #99b; color: #335; }
.badd-type.t-spk     { background: #ede8ff; border-color: #99b; color: #353; }
.badd-type.t-eval    { background: #ffe8f0; border-color: #b99; color: #533; }
.badd-type.t-recess  { background: #e8fff0; border-color: #9b9; color: #353; }
.badd-type.t-notes   { background: #fff8e8; border-color: #bb9; color: #553; }
.badd-type:hover { opacity: .8; }

/* ── PREVIEW PANEL ───────────────────────────────────── */
.pp {
  overflow-y: auto; background: #c0c4cc;
  padding: 20px; display: flex; justify-content: center; align-items: flex-start;
}

/* ═══════════════════════════════════════════════════════
   A4 PAGE — document-flow layout to match sample exactly
   ═══════════════════════════════════════════════════════ */
.page {
  background: #fff; width: 210mm; height: 297mm;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.25);
  font-family: Arial, sans-serif; font-size: 8pt; color: #000;
  display: flex; flex-direction: column;
  padding: 5mm 6mm 3mm 6mm;
}

/* ── DOC HEADER (CSS Grid) ───────────────────────────── */
.doc-header {
  display: grid;
  grid-template-columns: 42mm 1fr 24mm;
  align-items: center;
  column-gap: 3mm;
  margin-bottom: 2mm;
  flex-shrink: 0;
}
.doc-logo-left  { width: 100%; height: auto; display: block; }
.doc-logo-right { width: 100%; height: auto; display: block; }
.doc-hdr-center { text-align: center; line-height: 1.3; }
.club-name {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 12.5pt; font-weight: 700; color: #9B2F1F; display: block;
}
.club-addr {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 9pt; font-weight: 700; color: #C89000;
  display: block; line-height: 1.35;
}
.header-underline {
  width: 320px; height: 2px;
  margin: 16px auto 0 auto;
  background: linear-gradient(to right, transparent, #CE3C17, transparent);
}
.meeting-agenda-lbl {
  display: block;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 9.5pt; font-weight: 700; color: #000;
  text-transform: uppercase; letter-spacing: 1.5px;
  margin: 14px 0 0 0;
}
/* ── DOUBLE RED DIVIDER (replaces banner.png) ────────── */
.doc-divider {
  height: 6px; flex-shrink: 0;
  margin: 3mm 0 2mm 0;
  background: linear-gradient(to bottom,
    #CE3C17 0, #CE3C17 2.5px,
    #fff    2.5px, #fff    3.5px,
    #CE3C17 3.5px, #CE3C17 6px);
}

/* ── BANNER ──────────────────────────────────────────── */
.banner-img { width: 100%; display: block; margin-bottom: 2mm; flex-shrink: 0; }

/* ── INFO TABLE ──────────────────────────────────────── */
.info-outer {
  width: 100%; border-collapse: separate; border-spacing: 4px 0;
  border: none; flex-shrink: 0;
}
.info-outer > tbody > tr > td { border: none; padding: 0; vertical-align: middle; }
.info-outer > tbody > tr > td:first-child { padding-left: 0; }
.info-outer > tbody > tr > td:last-child  { padding-right: 0; }
.info-box { width: 100%; border-collapse: collapse; border: 1.5px solid #000; }
.info-box td {
  text-align: center; vertical-align: middle; padding: 3mm 2mm;
  font-family: Arial, Helvetica, sans-serif; line-height: 1.6;
}
.ib-head { display: block; font-size: 7pt;   font-weight: 700; font-style: italic; color: #000;    text-transform: uppercase; }
.ib-val  { display: block; font-size: 7.5pt; font-weight: 700; font-style: italic; color: #D6451E; }
.ib-date { display: block; font-size: 8.5pt; font-weight: 700; font-style: italic; color: #000; }
.ib-time { display: block; font-size: 7.5pt; font-weight: 700; font-style: italic; color: #D6451E; }

/* ── GAP BEFORE MISSION ──────────────────────────────── */
.info-gap { height: 10mm; flex-shrink: 0; }

/* ── MISSION ─────────────────────────────────────────── */
.mission {
  text-align: center; font-family: Arial, sans-serif;
  margin-bottom: 2.5mm; flex-shrink: 0;
}
.m-head    { display: block; font-size: 10pt; font-weight: 700; font-style: italic; color: #D6451E; text-transform: uppercase; margin-bottom: 2mm; }
.m-body    { display: block; font-size: 7.5pt; font-weight: 700; font-style: italic; color: #000; line-height: 1.55; margin-bottom: 1.5mm; }
.m-contact { display: block; font-size: 7pt;   font-weight: 400; font-style: italic; color: #FF0000; line-height: 1.4; }

/* ── CENTRED CONTENT CONTAINER ───────────────────────── */
.agenda-container {
  width: 90%;
  margin: 0 auto;
  box-sizing: border-box;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ── BODY CONTENT AREA ───────────────────────────────── */
.body-area { flex: 1; overflow: hidden; min-height: 0; }

/* ── MAIN AGENDA TABLE ───────────────────────────────── */
.ag { width: 100%; border-collapse: collapse; font-family: Arial; font-size: 7.5pt; font-style: italic; }
.ag td { padding: 1.5px 4px; vertical-align: top; line-height: 1.4; }
.ag .t  { width: 36px; white-space: nowrap; }
.ag .i  { width: 43%; }
.ag .p b { font-weight: 700; font-style: italic; }
.dual .da { width: 43%; }

/* ── SUB TABLES ──────────────────────────────────────── */
.stbl { border-collapse: collapse; font-family: Arial; font-size: 7pt; margin: 0.5mm 0 1.5mm 0; width: 100%; }
.stbl th {
  border: 1px solid #000; padding: 2px 4px;
  font-weight: 700; font-style: italic; background: #e0e0e0;
  text-align: left; font-size: 6.5pt;
}
.stbl td { border: 1px solid #000; padding: 2px 4px; font-style: italic; vertical-align: top; }
.stbl tr:nth-child(even) td { background: #fafafa; }

/* ── NOTES ───────────────────────────────────────────── */
.agenda-notes { font-family: Arial; font-size: 7.5pt; font-style: italic; margin-top: 1mm; padding-left: 36px; line-height: 1.5; }

/* ── FOOTER ──────────────────────────────────────────── */
.footer { border-top: 1.5px solid #000; padding-top: 1.5mm; flex-shrink: 0; }
.footer-title { font-family: Arial; font-size: 7.5pt; font-weight: 700; font-style: italic; color: var(--red); margin-bottom: 1.5mm; text-align: center; }
.ftbl { width: 100%; border-collapse: collapse; font-family: Arial; font-size: 6pt; }
.ftbl td { border: 1px solid #000; padding: 1.5px 3px; vertical-align: middle; line-height: 1.4; }
.ftbl .role  { font-weight: 700; white-space: nowrap; }
.ftbl .phone { white-space: nowrap; }
.ftbl .visit { color: var(--red); font-weight: 700; font-style: italic; }
.ftbl .url   { color: #0000CC; font-style: italic; text-align: center; }
.footer-fb { font-family: Arial; font-size: 6.5pt; text-align: center; margin-top: 1.5mm; font-weight: 700; color: var(--red); }

/* ── MEETING NOTES ───────────────────────────────────── */
.meeting-notes {
  margin-top: 20px; margin-bottom: 24px; margin-left: 0;
  text-align: left; flex-shrink: 0;
}
.meeting-notes p {
  margin: 4px 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 7.5pt; font-style: italic; line-height: 1.4; color: #000;
}

/* ── PRINT ───────────────────────────────────────────── */
@media print {
  body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .app-bar, .fp { display: none !important; }
  .layout { display: block; margin-top: 0; height: auto; }
  .pp { background: #fff; padding: 0; display: block; }
  .page { box-shadow: none; }
  .info-box, .info-box td, .stbl, .stbl td, .stbl th, .ftbl, .ftbl td,
  .doc-divider { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .info-box { border: 1.5px solid #000 !important; }
  .info-box td { border: none !important; }
  @page { size: A4 portrait; margin: 0; }
}
</style>
<script src="docx.iife.js"></script>
<script src="FileSaver.min.js"></script>
</head>
<body>

<!-- APP BAR -->
<div class="app-bar">
  <img src="logo.png" alt="Agora">
  <h1>Agora Agenda Creator</h1>
  <div class="sp"></div>
  <button class="btn" onclick="saveJSON()">&#128190; Export JSON</button>
  <button class="btn" onclick="loadJSON()">&#128193; Import JSON</button>
  <button class="btn" id="docxBtn" onclick="generateDocx(this)">&#11015; DOCX</button>
  <button class="btn red" onclick="document.title=agendaFileName(getData());window.print()">&#128438; Print / PDF</button>
</div>

<div class="layout">

  <!-- ══ FORM PANEL ══ -->
  <div class="fp"><div class="fb">

    <!-- MEETING DETAILS -->
    <div class="sec">
      <div class="sec-t">Meeting Details</div>
      <div class="g2">
        <div class="f"><label>Meeting Number</label><input type="number" id="fNo" value="160" oninput="R()"></div>
        <div class="f"><label>Meeting Date</label><input type="date" id="fDate" oninput="R()"></div>
      </div>
      <div class="g2">
        <div class="f"><label>Arrival Time</label><input type="time" id="fArr" value="18:00" oninput="R()"></div>
        <div class="f"><label>Start Time</label><input type="time" id="fSt" value="18:15" oninput="R()"></div>
      </div>
      <div class="f"><label>Meeting Theme</label><input type="text" id="fTheme" placeholder='e.g. April Fuel&#x2019;s Day' oninput="R()"></div>
      <div class="f"><label>Word of the Day</label><input type="text" id="fWord" placeholder='e.g. Expedient' oninput="R()"></div>
    </div>

    <!-- MEETING NOTES -->
    <div class="sec">
      <div class="sec-t">Meeting Notes</div>
      <div class="f"><label>Hot Seat</label><input type="text" id="fHotSeat" placeholder="Name" oninput="R()"></div>
      <div class="f"><label>Reserve Speaker</label><input type="text" id="fReserve" placeholder="Name" oninput="R()"></div>
      <div class="f"><label>Apologies</label><input type="text" id="fApologies" placeholder="Name(s)" oninput="R()"></div>
    </div>

    <!-- LOGOS -->
    <div class="sec">
      <div class="sec-t">Logos</div>
      <div class="f">
        <label>Left Logo</label>
        <div style="display:flex;gap:8px;align-items:center">
          <img id="prevLogoLeft" src="logo.png" style="height:36px;object-fit:contain;border:1px solid #ccc;padding:2px">
          <label class="btn" style="cursor:pointer;margin:0;font-size:7pt">Change<input type="file" accept="image/*" style="display:none" onchange="loadLogo('left',this)"></label>
          <button class="btn" style="font-size:7pt" onclick="resetLogo('left')">Reset</button>
        </div>
      </div>
      <div class="f">
        <label>Right Logo</label>
        <div style="display:flex;gap:8px;align-items:center">
          <img id="prevLogoRight" src="crown.png" style="height:36px;object-fit:contain;border:1px solid #ccc;padding:2px">
          <label class="btn" style="cursor:pointer;margin:0;font-size:7pt">Change<input type="file" accept="image/*" style="display:none" onchange="loadLogo('right',this)"></label>
          <button class="btn" style="font-size:7pt" onclick="resetLogo('right')">Reset</button>
        </div>
      </div>
    </div>

    <!-- CLUB INFO -->
    <div class="sec">
      <div class="sec-t">Club Info</div>
      <div class="f"><label>Club Name</label><input type="text" id="fClub" value="&quot;King&#x2019;s Speakers&quot; Club #12" oninput="R()"></div>
      <div class="f"><label>Club Sub-Name / Group</label><input type="text" id="fSub" value="Phobians," oninput="R()"></div>
      <div class="f"><label>Club Address</label><input type="text" id="fAddr" value="378 Queen&#x27;s Cres, Lynnwood, Pretoria, 0001" oninput="R()"></div>
      <div class="f"><label>Mission Statement</label>
        <textarea id="fMission" oninput="R()">Agora empowers you to become a brilliant communicator and a confident leader who will actively build a better world.</textarea>
      </div>
      <div class="f"><label>Mission Contact (VPE name)</label><input type="text" id="fVpe" oninput="R()"></div>
    </div>

    <!-- AGENDA ITEMS -->
    <div class="sec ag-section" id="agSection">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <div class="sec-t" style="margin-bottom:0;">Agenda Items</div>
        <button class="ag-edit-btn" id="agEditBtn" onclick="toggleAgEdit()">&#9998; Edit</button>
      </div>
      <div style="font-size:.65rem;color:#666;margin-bottom:6px;">
        Title &nbsp;|&nbsp; Role Label &nbsp;|&nbsp; Person &nbsp;|&nbsp; Duration (min)
      </div>
      <div id="agCards"></div>
      <div class="ag-add-bar">
        <button class="badd-type t-row"    onclick="addAg('row')">+ Row</button>
        <button class="badd-type t-dual"   onclick="addAg('dual')">+ Dual Row</button>
        <button class="badd-type t-spk"    onclick="addAg('speakers')">+ Speakers Table</button>
        <button class="badd-type t-eval"   onclick="addAg('evaluators')">+ Evaluators Table</button>
        <button class="badd-type t-recess" onclick="addAg('recess')">+ Recess</button>
        <button class="badd-type t-notes"  onclick="addAg('notes')">+ Notes</button>
      </div>
    </div>

    <!-- PREPARED SPEAKERS -->
    <div class="sec">
      <div class="sec-t">Prepared Speakers</div>
      <div id="spkCards"></div>
      <button class="badd" onclick="addSpk()">+ Add Speaker</button>
    </div>

    <!-- EXECUTIVE COMMITTEE -->
    <div class="sec">
      <div class="sec-t">Executive Committee</div>
      <div class="f"><label>Committee Period</label><input type="text" id="fPeriod" oninput="R()"></div>
      <div style="font-size:.69rem;font-weight:600;color:#57606a;margin:5px 0 4px;">Name &nbsp;&nbsp; Email &nbsp;&nbsp; Phone</div>
      <div id="cmtCards"></div>
      <div class="f" style="margin-top:6px;"><label>Website URL</label><input type="text" id="fWeb" value="http://www.agoraspeakers.org/" oninput="R()"></div>
      <div class="f"><label>Facebook Group Name</label><input type="text" id="fFb" value="Agora Speakers South Africa" oninput="R()"></div>
    </div>

    <div style="height:6px;"></div>
  </div></div><!-- /fp -->

  <!-- ══ PREVIEW PANEL ══ -->
  <div class="pp">
    <div class="page" id="pg"><!-- rendered by JS --></div>
  </div>

</div><!-- /layout -->

<input type="file" id="jf" accept=".json" style="display:none" onchange="importJSON(event)">

<script>
// ══ CONSTANTS ══════════════════════════════════════════
// TSLOTS removed — speaker time is now freeform lo/hi inputs

// ══ COMMITTEE STATE ════════════════════════════════════
const CMT_ROLES = ['President','Secretary','VP Education','Community Manager','VP Membership','RSA Ambassador','Treasurer'];
let cmt = [
  { role:'President',         name:'Mohaila Malefane',     email:'mohaila1@hotmail.com',        phone:'083 237 9912' },
  { role:'Secretary',         name:'Doreen Sibiya',         email:'doreensibiya2010@gmail.com',  phone:'073 281 7834' },
  { role:'VP Education',      name:'Obothlale Kganane',     email:'obothlale.kganane@gmail.com', phone:'062 711 5796' },
  { role:'Community Manager', name:'Zimasa Sobuza',         email:'zisobuza@gmail.com',          phone:'071 829 3201' },
  { role:'VP Membership',     name:'Viwe Peter',            email:'peterviwe@gmail.com',         phone:'066 360 9885' },
  { role:'RSA Ambassador',    name:'Chris Callaghan',       email:'agorasouthafrica@gmail.com',  phone:'082 375 2052' },

// ══ DRAG AND DROP ══════════════════════════════════════
let _dragId = null;

function _dragStart(e, id) {
  if (!agEditMode) { e.preventDefault(); return; }
  _dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', id);
  setTimeout(() => {
    const el = document.querySelector(`[data-ag-id="${id}"]`);
    if (el) el.classList.add('dragging');
  }, 0);
}

function _dragOver(e, id) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (id === _dragId) return;
  document.querySelectorAll('.ag-card').forEach(c => c.classList.remove('drag-over'));
  const el = document.querySelector(`[data-ag-id="${id}"]`);
  if (el) el.classList.add('drag-over');
}

function _dragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function _drop(e, id) {
  e.preventDefault();
  document.querySelectorAll('.ag-card').forEach(c => c.classList.remove('drag-over', 'dragging'));
  if (_dragId === null || _dragId === id) { _dragId = null; return; }
  const from = agItems.findIndex(i => i.id === _dragId);
  const to   = agItems.findIndex(i => i.id === id);
  if (from === -1 || to === -1) { _dragId = null; return; }
  const [moved] = agItems.splice(from, 1);
  agItems.splice(to, 0, moved);
  _dragId = null;
  buildAgendaForm(); R();
}

function _dragEnd() {
  _dragId = null;
  document.querySelectorAll('.ag-card').forEach(c => c.classList.remove('dragging', 'drag-over'));
}

// ══ SPEAKER FORM ═══════════════════════════════════════
function addSpk(d) {
  spId++;
  // migrate legacy 'time' string (e.g. '7-10 mins') to timeLo/timeHi
  let lo = d?.timeLo, hi = d?.timeHi;
  if ((lo == null || hi == null) && d?.time) {
    const ns = (d.time.match(/\d+/g)||[]).map(Number);
    lo = ns[0] ?? 7; hi = ns[1] ?? lo;
  }
  spks.push({ id:spId, name:d?.name||'', level:d?.level||'', timeLo:lo??7, timeHi:hi??10, title:d?.title||'', evaluator:d?.evaluator||'' });
  renderSpkCards(); R();
}
function remSpk(id) { spks = spks.filter(s => s.id !== id); renderSpkCards(); R(); }
function updSpk(id, f, v) {
  const s = spks.find(s => s.id === id);
  if (!s) return;
  s[f] = v;
  if (f === 'timeLo' && s.timeHi < s.timeLo) s.timeHi = s.timeLo;
  if (f === 'timeHi' && s.timeLo > s.timeHi) s.timeLo = s.timeHi;
  renderSpkCards(); R();
}

function renderSpkCards() {
  document.getElementById('spkCards').innerHTML = spks.map((s, i) => `
    <div class="card">
      <div class="ch"><span class="cl">Speaker ${i+1}</span>
        <button class="brm" onclick="remSpk(${s.id})">&#10005;</button></div>
      <div class="f"><label>Name</label>
        <input type="text" value="${x(s.name)}" oninput="updSpk(${s.id},'name',this.value)"></div>
      <div class="g2">
        <div class="f"><label>Level</label>
          <input type="text" value="${x(s.level)}" placeholder="e.g. L1 P1" oninput="updSpk(${s.id},'level',this.value)"></div>
        <div class="f"><label>Time (mins)</label>
          <div style="display:flex;gap:4px;align-items:center">
            <input type="number" min="1" max="60" value="${s.timeLo}" style="width:48px" oninput="updSpk(${s.id},'timeLo',+this.value)">
            <span>–</span>
            <input type="number" min="1" max="60" value="${s.timeHi}" style="width:48px" oninput="updSpk(${s.id},'timeHi',+this.value)">
          </div></div>
      </div>
      <div class="f"><label>Title</label>
        <input type="text" value="${x(s.title)}" oninput="updSpk(${s.id},'title',this.value)"></div>
      <div class="f"><label>Evaluator</label>
        <input type="text" value="${x(s.evaluator)}" oninput="updSpk(${s.id},'evaluator',this.value)"></div>
    </div>`).join('');
}

// ══ HELPERS ════════════════════════════════════════════
const g   = id => document.getElementById(id)?.value || '';
const x   = s  => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const toM = s  => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const fmM = n  => { const h=Math.floor(n/60)%24,m=n%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; };
const aT  = s  => { const [h,m]=s.split(':'); return `${h}h${m}`; };
const maxM = s => { const ns=(s.match(/\d+/g)||[]).map(Number); return ns.length?ns[ns.length-1]:7; };
const fmtD = iso => { if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-ZA',{day:'numeric',month:'long',year:'numeric'}); };

// ══ AGENDA RENDERER ════════════════════════════════════
function renderAgendaHtml(items, _spks, stMin, notes) {
  let html = '';
  let inTable = false;
  let t = stMin;
  const tick = n => { const r = aT(fmM(t)); t += n; return r; };
  const peek = () => aT(fmM(t));
  const COL = `<colgroup><col style="width:36px"><col style="width:43%"><col></colgroup>`;
  const open  = () => { if (!inTable) { html += `<table class="ag">${COL}<tbody>`; inTable=true; } };
  const close = () => { if (inTable)  { html += `</tbody></table>`; inTable=false; } };

  const pStr = item => {
    const role = item.roleLabel || '';
    const name = item.person   || '';
    if (role && name) return `<b>${role}:</b> ${name}`;
    if (role)         return `<b>${role}</b>`;
    return name;
  };

  for (const item of items) {
    switch (item.type) {
      case 'row':
      case 'recess': {
        open();
        const time = tick(item.duration || 0);
        html += `<tr><td class="t">${time}</td><td class="i">${item.title||''}</td><td class="p">${pStr(item)}</td></tr>`;
        break;
      }
      case 'dual': {
        open();
        const a = item.items?.[0] || {};
        const b = item.items?.[1] || {};
        const tA = tick(item.durationA || 10);
        const tB = peek();
        _spks.forEach(s => { t += (s.timeHi ?? maxM(s.time)) + 2; });
        t += 1;
        html += `<tr class="dual">
          <td class="t">${tA}<br>${tB}</td>
          <td class="da">${a.title||''}<br>${b.title||''}</td>
          <td class="db">${pStr(a)}<br>${pStr(b)}</td>
        </tr>`;
        break;
      }
      case 'speakers': {
        close();
        if (_spks.length) {
          html += `<table class="stbl">
            <thead><tr><th>Speaker</th><th>Level</th><th>Time</th><th>Title</th><th>Evaluator</th></tr></thead>
            <tbody>${_spks.map(s=>`<tr>
              <td>${s.name||'&mdash;'}</td><td>${s.level||'&mdash;'}</td>
              <td>${s.timeLo}-${s.timeHi} mins</td><td>${s.title||'&mdash;'}</td><td>${s.evaluator||'&mdash;'}</td>
            </tr>`).join('')}</tbody>
          </table>`;
        }
        break;
      }
      case 'evaluators': {
        _spks.forEach(() => { t += 4; });
        close();
        if (_spks.length) {
          html += `<table class="stbl">
            <thead><tr><th>Evaluator</th><th>Time</th><th>Title</th><th>Speaker</th></tr></thead>
            <tbody>${_spks.map(s=>`<tr>
              <td>${s.evaluator||'&mdash;'}</td><td>2&ndash;4 mins</td>
              <td>${s.title||'&mdash;'}</td><td>${s.name||'&mdash;'}</td>
            </tr>`).join('')}</tbody>
          </table>`;
        }
        break;
      }
      case 'notes': {
        close();
        if (item.text) {
          html += `<div class="agenda-notes">${item.text.replace(/\n/g,'<br>')}</div>`;
        }
        break;
      }
    }
  }
  close();
  return html;
}

function getData() {

    no:g('fNo'), date:g('fDate'), arr:g('fArr'), st:g('fSt'),
    theme:g('fTheme'), word:g('fWord'),
    club:g('fClub'), sub:g('fSub'), addr:g('fAddr'),

    agItems: agItems.map(i => ({...i, items: i.items?.map(s=>({...s}))})),
    spks:    spks.map(s=>({...s})),
    cmt:     cmt.map(c=>({...c})),
  };
}

function loadLogo(side, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (side === 'left')  { logoLeft  = e.target.result; document.getElementById('prevLogoLeft').src  = e.target.result; }
    if (side === 'right') { logoRight = e.target.result; document.getElementById('prevLogoRight').src = e.target.result; }
    input.value = '';
    R();
  };
  reader.readAsDataURL(file);
}

function resetLogo(side) {
  if (side === 'left')  { logoLeft  = 'logo.png';  document.getElementById('prevLogoLeft').src  = 'logo.png';  }
  if (side === 'right') { logoRight = 'crown.png'; document.getElementById('prevLogoRight').src = 'crown.png'; }
  R();
}

function saveJSON() {
  const d = getData();
  const blob = new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`${agendaFileName(d)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

function loadJSON() { document.getElementById('jf').click(); }

function importJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      const s = (id,v) => { const el=document.getElementById(id); if(el&&v!=null) el.value=v; };
      s('fNo',d.no); s('fDate',d.date); s('fArr',d.arr); s('fSt',d.st);
      s('fTheme',d.theme); s('fWord',d.word);
      s('fClub',d.club); s('fSub',d.sub); s('fAddr',d.addr);
      s('fMission',d.mission); s('fVpe',d.vpe);
      s('fHotSeat',d.hotSeat); s('fReserve',d.reserve); s('fApologies',d.apologies);
      s('fPeriod',d.period); s('fWeb',d.web); s('fFb',d.fb);

      if (Array.isArray(d.cmt)) { cmt=d.cmt; buildCmtForm(); }

      if (Array.isArray(d.agItems)) {
        agId = 0;
        agItems = d.agItems.map(i => { if(i.id>agId) agId=i.id; return {...i, items:i.items?.map(s=>({...s}))}; });
        buildAgendaForm();
      }

      if (Array.isArray(d.spks)) {
        spks=[]; spId=0;
        d.spks.forEach(s => addSpk(s));
      } else { R(); }
    } catch(err) { alert('Error loading JSON: '+err.message); }
  };
  reader.readAsText(file);
  e.target.value='';
}

function agendaFileName(d) {
  const dt = d.date ? new Date(d.date + 'T00:00:00') : null;
  const datePart = dt ? dt.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : 'draft';

// ══ IMAGE HELPERS ══════════════════════════════════════
// logoLeft/logoRight are always data URLs (embedded defaults or user upload) — no fetch needed
function fetchImageBuffer(src) {
  const base64 = src.split(',')[1];
  const bin = atob(base64);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

async function getImageDims(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => resolve({ w: 200, h: 100 });
    img.src = src;
  });
}

// ══ VALIDATION HELPERS ═════════════════════════════════
function assertWidths(name, widths, expected) {
  const sum = widths.reduce((a, b) => a + b, 0);
  if (sum !== expected) {
    console.error(`[DOCX] assertWidths FAIL: ${name} sum=${sum} expected=${expected} widths=[${widths}]`);
    throw new Error(`DOCX layout error: ${name} column widths sum to ${sum}, expected ${expected}`);
  }
}
function assertImageFitsCell(name, imgPx, cellTwips, leftMg, rightMg) {
  const imgTwips = Math.round(imgPx * 15);
  const usable   = cellTwips - leftMg - rightMg;
  if (imgTwips > usable) {
    console.warn(`[DOCX] assertImageFitsCell WARN: ${name} imgTwips=${imgTwips} > usable=${usable} (cell=${cellTwips} margins=${leftMg}+${rightMg})`);
  }
}
function scaledImageSize(ow, oh, targetW) {
  return { width: targetW, height: Math.round(oh * targetW / ow) };
}

// ══ DOCX HELPERS ═══════════════════════════════════════
function dxNoSpace(extra) {
  return { before: 0, after: 0, line: 240, lineRule: 'auto', ...(extra||{}) };
}
function dxPara(runs, opts) {
  return new docx.Paragraph({ spacing: dxNoSpace(), ...(opts||{}), children: Array.isArray(runs) ? runs : [runs] });
}
// All cells must use explicit DXA width — no percentage, no auto
function dxCell(children, opts) {
  const { borders=NO_BORDERS, width, vAlign=docx.VerticalAlign.TOP, shading, margins } = opts||{};
  if (!width) throw new Error('dxCell: width (DXA) is required');
  return new docx.TableCell({
    children: Array.isArray(children) ? children : [children],
    borders,
    width: { size: width, type: docx.WidthType.DXA },
    verticalAlign: vAlign,
    ...(shading ? { shading } : {}),
    margins: margins || { top: 40, bottom: 40, left: 60, right: 60 },
  });
}
function dxRow(cells, opts) {
  return new docx.TableRow({ children: cells, ...(opts||{}) });
}
function dxTable(rows, opts) {
  const { width=CONTENT_W, borders=NO_BORDERS, columnWidths } = opts||{};
  if (columnWidths) assertWidths('dxTable', columnWidths, width);
  return new docx.Table({
    rows,
    width: { size: width, type: docx.WidthType.DXA },
    borders,
    layout: docx.TableLayoutType.FIXED,
    ...(columnWidths ? { columnWidths } : {}),
  });
}

function dxBuildAgendaBody(items, _spks, d) {
  assertWidths('AGENDA', [TIME_W, ACTIVITY_W, PERSON_W], CONTENT_W);
  const toMin = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
  const fmMin = n => { const h=Math.floor(n/60)%24,m=n%60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; };
  const aT    = s => { const [h,m]=s.split(':'); return `${h}h${m}`; };
  let t = toMin(d.st||'18:15');
  const tick = n => { const r=aT(fmMin(t)); t+=n; return r; };
  const peek = ()  => aT(fmMin(t));
  function personRuns(item) {
    const role = item.roleLabel||'', name = item.person||'';
    const runs = [];
    if (role) runs.push(new docx.TextRun({ text: role+(name?': ':''), font:'Arial', size:15, bold:true, italics:true }));
    if (name) runs.push(new docx.TextRun({ text: name, font:'Arial', size:15, italics:true }));
    return runs.length ? runs : [new docx.TextRun({ text:'' })];
  }
  function agRow(timeStr, title, pRuns) {
    return dxRow([
      dxCell([dxPara([new docx.TextRun({ text:timeStr, font:'Arial', size:15, italics:true })], { spacing:dxNoSpace() })], { width:TIME_W,     vAlign:docx.VerticalAlign.TOP }),
      dxCell([dxPara([new docx.TextRun({ text:title,   font:'Arial', size:15, italics:true })], { spacing:dxNoSpace() })], { width:ACTIVITY_W, vAlign:docx.VerticalAlign.TOP }),
      dxCell([dxPara(pRuns, { spacing:dxNoSpace() })],                                                                    { width:PERSON_W,   vAlign:docx.VerticalAlign.TOP }),
    ], { cantSplit:true });
  }
  const sections = [];
  let rowBuf = [];
  function flush() {
    if (rowBuf.length) {
      sections.push(dxTable(rowBuf, { columnWidths:[TIME_W, ACTIVITY_W, PERSON_W] }));
      rowBuf = [];
    }
  }
  for (const item of items) {
    switch (item.type) {
      case 'row':
      case 'recess': {
        const time = tick(item.duration||0);
        rowBuf.push(agRow(time, item.title||'', personRuns(item)));
        break;
      }
      case 'dual': {
        const a=item.items?.[0]||{}, b=item.items?.[1]||{};
        const tA=tick(item.durationA||10), tB=peek();
        _spks.forEach(s => { t += (s.timeHi||7)+2; }); t+=1;
        rowBuf.push(dxRow([
          dxCell([dxPara([new docx.TextRun({ text:tA, font:'Arial', size:15, italics:true })], { spacing:dxNoSpace() }),
                  dxPara([new docx.TextRun({ text:tB, font:'Arial', size:15, italics:true })], { spacing:dxNoSpace() })], { width:TIME_W,     vAlign:docx.VerticalAlign.TOP }),
          dxCell([dxPara([new docx.TextRun({ text:a.title||'', font:'Arial', size:15, italics:true })], { spacing:dxNoSpace() }),
                  dxPara([new docx.TextRun({ text:b.title||'', font:'Arial', size:15, italics:true })], { spacing:dxNoSpace() })], { width:ACTIVITY_W, vAlign:docx.VerticalAlign.TOP }),
          dxCell([dxPara(personRuns(a), { spacing:dxNoSpace() }),
                  dxPara(personRuns(b), { spacing:dxNoSpace() })], { width:PERSON_W, vAlign:docx.VerticalAlign.TOP }),
        ], { cantSplit:true }));
        break;
      }
      case 'speakers': {
        flush();
        if (_spks.length) sections.push(dxBuildSpeakersTable(_spks));
        break;
      }
      case 'evaluators': {
        _spks.forEach(()=>{ t+=4; });
        flush();
        if (_spks.length) sections.push(dxBuildEvaluatorsTable(_spks));
        break;
      }
    }
  }
  flush();
  return sections;
}

// ══ MAIN DOCX GENERATOR ════════════════════════════════
async function generateDocx(btn) {
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Building…';
  try {
    if (typeof docx === 'undefined')   throw new Error('docx library not loaded.');
    if (typeof saveAs === 'undefined') throw new Error('FileSaver library not loaded.');
    const d     = getData();
    const fname = agendaFileName(d);
    const leftBuf  = fetchImageBuffer(logoLeft);
    const rightBuf = fetchImageBuffer(logoRight);
    const [leftDims, rightDims] = await Promise.all([getImageDims(logoLeft), getImageDims(logoRight)]);
    console.table([
      { section:'HEADER',  widths:[HEADER_LEFT_W,HEADER_CENTER_W,HEADER_RIGHT_W].join(','), sum:HEADER_LEFT_W+HEADER_CENTER_W+HEADER_RIGHT_W },
      { section:'INFO',    widths:INFO_WIDTHS.join(','),    sum:INFO_WIDTHS.reduce((a,b)=>a+b,0) },
      { section:'AGENDA',  widths:[TIME_W,ACTIVITY_W,PERSON_W].join(','), sum:TIME_W+ACTIVITY_W+PERSON_W },
      { section:'SPEAKERS',widths:SPK_WIDTHS.join(','),     sum:SPK_WIDTHS.reduce((a,b)=>a+b,0) },
      { section:'EVAL',    widths:EVAL_WIDTHS.join(','),    sum:EVAL_WIDTHS.reduce((a,b)=>a+b,0) },
      { section:'FOOTER',  widths:FOOTER_WIDTHS.join(','),  sum:FOOTER_WIDTHS.reduce((a,b)=>a+b,0) },
    ]);
    console.log('[DOCX] leftDims:', leftDims, '| rightDims:', rightDims, '| CONTENT_W:', CONTENT_W);
    const children = [
      dxBuildHeader(leftBuf, leftDims, rightBuf, rightDims, d),
      ...dxBuildDivider(),
      dxPara([new docx.TextRun({ text:'' })], { spacing:{ before:60, after:60 } }),
      dxBuildInfoBoxes(d),
      ...dxBuildMission(d),
      ...dxBuildAgendaBody(agItems, spks, d),
      ...dxBuildMeetingNotes(d),
      ...dxBuildCommitteeFooter(cmt, d),
    ];
    const doc = new docx.Document({
      styles: { default: { document: { run: { font:'Arial', size:16 } } } },
      sections: [{
        properties: { page: { size:{ width:11906, height:16838 }, margin:{ top:280, bottom:220, left:680, right:680 } } },
        children,
      }],
    });
    const blob = await docx.Packer.toBlob(doc);
    const sig  = new Uint8Array(await blob.slice(0,2).arrayBuffer());
    if (sig[0] !== 0x50 || sig[1] !== 0x4B) throw new Error('Output is not a valid DOCX file.');
    saveAs(blob, fname + '.docx');
  } catch(err) {
    alert('DOCX generation failed:\n' + err.message);
    console.error(err);
  } finally {
    btn.disabled    = false;
    btn.textContent = origText;
  }
}
